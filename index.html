  window.saveCategoryManageModal = function(catId, matchId){
    const div = state.div;
    const cats = getTacticCategories(div);
    const cat = cats.find(c => c.id === catId);
    if(!cat) return;

    const inp = document.getElementById('cat_label_input');
    const val = inp ? inp.value.trim() : '';
    if(val){
      cat.label = val;
      saveTacticCategories(div);
    }
    closeTacticRenameModal();
    updateTacticsUI(matchId);
  };

  window.deleteTacticCategory = function(catId, matchId){
    const div = state.div;
    const cats = getTacticCategories(div);
    if(cats.length <= 1){
      alert('최소 1개의 전술 탭은 유지되어야 합니다.');
      return;
    }
    const cat = cats.find(c => c.id === catId);
    if(!confirm(`'${cat ? cat.label : ''}' 탭과 세부 전술들을 모두 삭제할까요?`)) return;

    state.tacticCategories[div] = cats.filter(c => c.id !== catId);
    saveTacticCategories(div);

    const mt = getMatchTactics(div, matchId);
    if(mt.activeTab === catId){
      mt.activeTab = state.tacticCategories[div][0].id;
      saveTactics(div);
    }
    closeTacticRenameModal();
    updateTacticsUI(matchId);
  };

  // ---------- 세부 전술 항목 추가 및 삭제 ----------
  window.addNewTacticItem = function(catId, matchId){
    const div = state.div;
    const cats = getTacticCategories(div);
    const cat = cats.find(c => c.id === catId);
    if(!cat) return;

    reindexTacticCategory(cat);
    const newId = cat.items.length + 1;
    cat.items.push({ id: newId, name: `${newId}번` });
    reindexTacticCategory(cat);
    saveTacticCategories(div);
    updateTacticsUI(matchId);
  };

  window.deleteTacticItem = function(catId, itemId, matchId, reopenModalType = null){
    const div = state.div;
    const cats = getTacticCategories(div);
    const cat = cats.find(c => c.id === catId);
    if(!cat) return;
    if(cat.items.length <= 1){
      alert('최소 1개의 세부 전술은 유지되어야 합니다.');
      return;
    }
    cat.items = cat.items.filter(it => it.id !== itemId);
    reindexTacticCategory(cat);
    saveTacticCategories(div);

    // 숨김 목록 및 현재 전술 동기화 (번호가 당겨지므로 로테이션 상태 초기화)
    const mt = getMatchTactics(div, matchId);
    if(mt.hidden && mt.hidden[catId]){
      mt.hidden[catId] = [];
    }
    saveTactics(div);

    if(reopenModalType === 'rename'){
      openTacticRenameModal(catId, matchId);
    } else if(reopenModalType === 'delete'){
      openTacticDeleteModal(catId, matchId);
    } else {
      closeTacticRenameModal();
    }
    updateTacticsUI(matchId);
  };

  // ---------- 세부 전술 삭제 모달 ----------
  window.openTacticDeleteModal = function(catId, matchId){
    const div = state.div;
    const cats = getTacticCategories(div);
    const cat = cats.find(c => c.id === catId);
    if(!cat) return;
    if(cat.items.length <= 1){
      alert('현재 탭에 전술이 1개뿐이어서 더 이상 삭제할 수 없습니다.');
      return;
    }

    reindexTacticCategory(cat);
    const lastItem = cat.items[cat.items.length - 1];

    let rowsHtml = '';
    cat.items.forEach(it => {
      const displayName = (it.name && it.name.trim()) ? it.name.trim() : `${it.id}번`;
      rowsHtml += `

          <button class="tactics-modal-btn danger" onclick="if(confirm('\\'${cat.label} ${displayName}\\' 전술을 삭제할까요?')) { deleteTacticItem('${catId}', ${it.id}, ${matchId}, (${cat.items.length} > 2 ? 'delete' : null)); }" style="padding:4px 10px; font-size:11.5px; color:#F87171; border-color:rgba(239,68,68,0.4);">
            🗑️ 삭제
          </button>
        </div>
      `;
    });

    const lastDisplayName = (lastItem.name && lastItem.name.trim()) ? lastItem.name.trim() : `${lastItem.id}번`;
    const modalHtml = `
      <div class="tactics-modal-backdrop" id="tacticsRenameModal" onclick="if(event.target===this) closeTacticRenameModal();">
        <div class="tactics-modal-content" style="max-width:380px;">
          <div class="tactics-modal-header">
            <div class="tactics-modal-title">
              <span>🗑️</span>
              <span>[${cat.label}] 전술 번호 삭제</span>
            </div>
            <button class="tactics-modal-close" onclick="closeTacticRenameModal()">✕</button>
          </div>
          <div class="tactics-modal-body">
            <div class="tactics-modal-desc" style="margin-bottom:12px;">
              삭제할 전술 번호를 선택하세요. (현재 총 ${cat.items.length}개)
            </div>

            <!-- 마지막 번호 즉시 삭제 버튼 -->
            <button class="tactics-modal-btn danger" onclick="if(confirm('\\'${cat.label} ${lastDisplayName}\\'(마지막 번호)을 삭제할까요?')) { deleteTacticItem('${catId}', ${lastItem.id}, ${matchId}, (${cat.items.length} > 2 ? 'delete' : null)); }" style="width:100%; justify-content:center; padding:10px 0; margin-bottom:14px; font-size:13px; font-weight:800; background:rgba(239,68,68,0.12); border:1.5px solid #EF4444; color:#FCA5A5; cursor:pointer;">
              ⚡ 마지막 전술 (${lastDisplayName}) 바로 삭제
            </button>

            <div style="font-size:11px; font-weight:800; color:var(--text-faint); margin-bottom:6px; letter-spacing:0.5px;">전체 전술 목록에서 선택 삭제:</div>
            <div style="max-height:220px; overflow-y:auto; padding-right:2px;">
              ${rowsHtml}
            </div>
          </div>
          <div class="tactics-modal-footer">
            <div></div>
            <button class="tactics-modal-btn secondary" onclick="closeTacticRenameModal()">닫기</button>
          </div>
        </div>
      </div>
    `;

    closeTacticRenameModal();
    const divEl = document.createElement('div');
    divEl.id = 'tacticsModalContainer';
    divEl.innerHTML = modalHtml;
    document.body.appendChild(divEl);
  };

  // ---------- 세부 전술 편집 모달 (이름 변경 + 세부 추가/삭제) ----------
  window.openTacticRenameModal = function(catId, matchId){
    const div = state.div;
    const cats = getTacticCategories(div);
    const cat = cats.find(c => c.id === catId);
    if(!cat) return;

    reindexTacticCategory(cat);

    let rowsHtml = '';
    cat.items.forEach(it => {
      const val = (!it.name || it.name.trim() === `${it.id}번`) ? '' : it.name.trim();
      rowsHtml += `
        <div class="tactics-rename-row">
          <div class="tactics-rename-badge">${it.id}번</div>
          <input type="text" class="tactics-rename-input" id="tactic_item_input_${it.id}"
            placeholder="${it.id}번 전술 이름 (예: 중앙 공격, 페이크 등)" value="${val}" maxlength="15"
            onkeydown="if(event.key==='Enter') saveTacticRenameModal('${catId}', ${matchId})">
          ${cat.items.length > 1 ? `<button class="del-player-btn" onclick="deleteTacticItem('${catId}', ${it.id}, ${matchId}, 'rename')" title="이 전술 삭제" style="color:#F87171; font-size:16px;">✕</button>` : ''}
        </div>
      `;
    });

    const modalHtml = `
      <div class="tactics-modal-backdrop" id="tacticsRenameModal" onclick="if(event.target===this) closeTacticRenameModal();">
        <div class="tactics-modal-content">
          <div class="tactics-modal-header">
            <div class="tactics-modal-title">
              <span>✏️</span>
              <span>[${cat.label}] 세부 전술 편집</span>
            </div>
            <button class="tactics-modal-close" onclick="closeTacticRenameModal()">✕</button>
          </div>
          <div class="tactics-modal-body">
            <div class="tactics-modal-desc">
              경기 중 쉽게 알아볼 수 있도록 <b>${cat.label}</b> 탭의 전술 이름을 지정하고 항목을 추가/삭제하세요. 빈 칸은 원래 번호(1번, 2번...)로 유지됩니다.
            </div>
            ${rowsHtml}
            <div style="margin-top:6px; text-align:center;">
              <button class="tactics-tab-add-btn" onclick="addNewTacticItem('${catId}', ${matchId}); openTacticRenameModal('${catId}', ${matchId});" style="width:100%; justify-content:center; padding:8px 0;">
                + 세부 전술 항목 추가
              </button>
            </div>
          </div>
          <div class="tactics-modal-footer">
            <button class="tactics-modal-btn danger" onclick="resetTacticNamesToDefault('${catId}', ${matchId})">
              기본 번호로 초기화
            </button>
            <div style="display:flex; gap:6px;">
              <button class="tactics-modal-btn secondary" onclick="closeTacticRenameModal()">
                취소
              </button>
              <button class="tactics-modal-btn primary" onclick="saveTacticRenameModal('${catId}', ${matchId})">
                저장 완료
              </button>
            </div>
          </div>
        </div>
      </div>
    `;

    closeTacticRenameModal();
    const divEl = document.createElement('div');
    divEl.id = 'tacticsModalContainer';
    divEl.innerHTML = modalHtml;
    document.body.appendChild(divEl);

    setTimeout(() => {
      if(cat.items.length > 0){
        const firstInp = document.getElementById(`tactic_item_input_${cat.items[0].id}`);
        if(firstInp) firstInp.focus();
      }
    }, 80);
  };

  window.closeTacticRenameModal = function(){
    const el = document.getElementById('tacticsModalContainer');
    if(el) el.remove();
  };

  window.saveTacticRenameModal = function(catId, matchId){
    const div = state.div;
    const cats = getTacticCategories(div);
    const cat = cats.find(c => c.id === catId);
    if(!cat) return;

    cat.items.forEach((it, idx) => {
      const inp = document.getElementById(`tactic_item_input_${it.id}`);
      const val = inp ? inp.value.trim() : '';
      it.name = val ? val : `${idx + 1}번`;
    });

    reindexTacticCategory(cat);
    saveTacticCategories(div);
    closeTacticRenameModal();
    updateTacticsUI(matchId);
  };

  window.resetTacticNamesToDefault = function(catId, matchId){
    const div = state.div;
    const cats = getTacticCategories(div);
    const cat = cats.find(c => c.id === catId);
    if(!cat) return;

    if(confirm(`'${cat.label}' 전술 이름을 모두 기본 번호(1번, 2번...)로 초기화할까요?`)){
      cat.items.forEach((it, idx) => {
        const num = idx + 1;
        it.id = num;
        it.name = `${num}번`;
      });
      reindexTacticCategory(cat);
      saveTacticCategories(div);
      closeTacticRenameModal();
      updateTacticsUI(matchId);
    }
  };

  function updateTacticsUI(matchId){
    const div = state.div;
    const mId = Number(matchId);
    const wrapEl = document.getElementById(`tactics_box_wrap_${mId}`);
    if(wrapEl){
      wrapEl.innerHTML = renderTacticsBox(div, mId);
    }
    // 토글 버튼 상단 배지도 실시간 갱신
    const pillEl = document.getElementById(`tactics_pill_${mId}`);
    const mt = getMatchTactics(div, mId);
    if(pillEl){
      if(mt.current){
        pillEl.textContent = `현재: ${mt.current}`;
        pillEl.style.display = 'inline-flex';
      } else {
        pillEl.style.display = 'none';
      }
    }
  }

  window.togglePlayerStats = function(matchId){
    const div = state.div;
    const mId = Number(matchId);
    if(state.expandedPlayerMatch[div] === mId){
      state.expandedPlayerMatch[div] = null;
    } else {
      state.expandedPlayerMatch[div] = mId;
    }
    const el = document.getElementById(`ps_area_${mId}`);
    if(el){
      el.classList.toggle('hidden');
    }
  };

  window.fillSchoolInput = function(matchId, schoolName){
    const schoolInp = document.getElementById(`matchAddSchool_${matchId}`);
    if(schoolInp){ schoolInp.value = schoolName; }
  };

  window.addMatchPlayer = function(matchId){
    const div = state.div;
    const mId = Number(matchId);
    const noInp = document.getElementById(`matchAddNo_${mId}`);
    const nameInp = document.getElementById(`matchAddName_${mId}`);
    const schoolInp = document.getElementById(`matchAddSchool_${mId}`);
    let noStr = (noInp ? noInp.value || '' : '').trim();
    const name = (nameInp ? nameInp.value || '' : '').trim();
    const school = (schoolInp ? schoolInp.value || '' : '').trim();

    if(!name){
      if(nameInp){
        nameInp.focus();
        nameInp.style.borderColor = 'var(--red)';
        setTimeout(() => { nameInp.style.borderColor = ''; }, 1500);
      }
      return;
    }

    if(!state.roster[div] || Array.isArray(state.roster[div])) state.roster[div] = {};
    if(!state.roster[div][mId]) state.roster[div][mId] = [];
    const matchRoster = state.roster[div][mId];

    let noNum = Number(noStr);
    if(!noStr || isNaN(noNum) || noNum <= 0){
      const maxNo = matchRoster.reduce((max, p) => (p.no > max ? p.no : max), 0);
      noNum = maxNo + 1;
    }

    const existingIdx = matchRoster.findIndex(p => p.no === noNum);
    if(existingIdx >= 0){
      matchRoster[existingIdx] = { no: noNum, name, school };
    } else {
      matchRoster.push({ no: noNum, name, school });
    }
    matchRoster.sort((a,b) => a.no - b.no);
    saveRoster(div);
    state.expandedPlayerMatch[div] = mId;
    render();

    setTimeout(() => {
      const nextNameInp = document.getElementById(`matchAddName_${mId}`);
      const nextNoInp = document.getElementById(`matchAddNo_${mId}`);
      if(nextNoInp) nextNoInp.value = '';
      if(nextNameInp){
        nextNameInp.value = '';
        nextNameInp.focus();
      }
    }, 50);
  };

  window.deleteMatchPlayer = function(matchId, pno){
    const div = state.div;
    const mId = Number(matchId);
    const no = Number(pno);
    if(state.roster[div] && !Array.isArray(state.roster[div]) && state.roster[div][mId]){
      state.roster[div][mId] = state.roster[div][mId].filter(p => p.no !== no);
      saveRoster(div);
      state.expandedPlayerMatch[div] = mId;
      render();
    }
  };

  window.changePlayerStat = function(matchId, pno, ptype, delta){
    const div = state.div;
    const mId = Number(matchId);
    const playerNo = Number(pno);
    const step = Number(delta);
    if(!state.playerStats[div][mId]) state.playerStats[div][mId] = {};
    if(!state.playerStats[div][mId][playerNo]) state.playerStats[div][mId][playerNo] = { op:0, adp:0, dp:0 };
    const cur = state.playerStats[div][mId][playerNo];
    cur[ptype] = Math.max(0, (cur[ptype] || 0) + step);
    savePlayerStats(div);
    const valEl = document.getElementById(`pval_${mId}_${playerNo}_${ptype}`);
    if(valEl){
      valEl.textContent = cur[ptype];
    }
  };

  // ---------- excel import ----------
  function handleExcelImport(e){
    const file = e.target.files[0];
    if(!file) return;
    const msgEl = document.getElementById('importMsg');
    const reader = new FileReader();
    reader.onload = function(evt){
      try{
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, {type:'array'});
        let imported = 0;

        // Try to find time info from any sheet that has '시간' column
        wb.SheetNames.forEach(sn => {
          const ws = wb.Sheets[sn];
          const json = XLSX.utils.sheet_to_json(ws, {defval:''});
          json.forEach(row => {
            // Try to match by 경기/종별 column to find match label
            const label = row['경기'] || row['종별'] || row['경기번호'] || '';
            const time = row['시간'] || '';
            const pScore = row['PINK 점수 (입력)'] || row['PINK 점수'];
            const gScore = row['GRAY 점수 (입력)'] || row['GRAY 점수'];
            const bScore = row['BLACK 점수 (입력)'] || row['BLACK 점수'];
            if(!label) return;

            // Determine division and match from label
            ['boys','girls','midGirls'].forEach(div => {
              DATA[div].matches.forEach(m => {
                if(m.label === String(label).trim()){
                  // Import time
                  if(time && String(time).trim()){
                    state.times[div][m.id] = String(time).trim();
                    imported++;
                  }
                  // Import scores if present
                  if(pScore !== '' && pScore !== undefined && gScore !== '' && bScore !== ''){
                    if(!state.scores[div][m.id]) state.scores[div][m.id] = {p:'',g:'',b:''};
                    state.scores[div][m.id].p = Number(pScore);
                    state.scores[div][m.id].g = Number(gScore);
                    state.scores[div][m.id].b = Number(bScore);
                  }
                }
              });
            });
          });
        });

        if(imported > 0){
          saveTimes('boys'); saveTimes('girls'); saveTimes('midGirls');
          saveScores('boys'); saveScores('girls'); saveScores('midGirls');
          showImportMsg(msgEl, `✓ ${imported}건 불러옴`, false);
        } else {
          showImportMsg(msgEl, '일치하는 경기를 찾지 못했어요', true);
        }
        render();
      } catch(err){
        console.error('Excel import error:', err);
        showImportMsg(msgEl, '파일을 읽을 수 없어요', true);
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = ''; // reset so same file can be re-selected
  }

  function showImportMsg(el, text, isErr){
    if(!el) return;
    el.textContent = text;
    el.classList.toggle('err', isErr);
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  // avoid losing input focus/caret while typing scores rapidly
  function renderPreserveFocus(el, isSim){
    const activeSel = el.dataset.match + '|' + el.dataset.key + (isSim?'|sim':'');
    render();
    const again = document.querySelector(
      isSim ? `[data-simnum][data-match="${el.dataset.match}"][data-key="${el.dataset.key}"]`
            : `.score-input[data-match="${el.dataset.match}"][data-key="${el.dataset.key}"]`
    );
    if(again){
      again.focus();
      try{ const val = again.value; again.setSelectionRange(val.length, val.length); }catch(e){ /* selection range unsupported — ignore */ }
    }
  }

  // ---------- theme bindings ----------
  function initTheme(){
    const saved = localStorage.getItem('kb_theme') || 'dark';
    applyTheme(saved);
  }
  const THEME_SUN_SVG = `<svg class="theme-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
  const THEME_MOON_SVG = `<svg class="theme-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('kb_theme', t);
    const btn = document.getElementById('themeToggleBtn');
    if(btn){
      btn.innerHTML = t === 'dark' ? THEME_SUN_SVG : THEME_MOON_SVG;
      btn.setAttribute('title', t === 'dark' ? '밝은 모드로 전환' : '어두운 모드로 전환');
    }
  }
  document.getElementById('themeToggleBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  // ---------- nav bindings ----------
  document.getElementById('divisionSwitch').addEventListener('click', e => {
    const btn = e.target.closest('button'); if(!btn) return;
    state.div = btn.dataset.div;
    render();
  });
  document.getElementById('bottomNav').addEventListener('click', e => {
    const btn = e.target.closest('button'); if(!btn) return;
    state.tab = btn.dataset.tab;
    render();
  });

  // ---------- cloud badge click event ----------
  const badgeEl = document.getElementById('cloudStatusBadge');
  if(badgeEl){
    badgeEl.addEventListener('click', handleBadgeClick);
  }

  // ---------- boot ----------
  async function boot(){
    initTheme();
    // 1. Load from local cache first for instant UI response
    await Promise.all([
      loadScores('boys'), loadScores('girls'), loadScores('midGirls'),
      loadTimes('boys'), loadTimes('girls'), loadTimes('midGirls'),
      loadTeamColors('boys'), loadTeamColors('girls'), loadTeamColors('midGirls'),
      loadTeamNames('boys'), loadTeamNames('girls'), loadTeamNames('midGirls'),
      loadRoster('boys'), loadRoster('girls'), loadRoster('midGirls'),
      loadPlayerStats('boys'), loadPlayerStats('girls'), loadPlayerStats('midGirls'),
      loadMemos('boys'), loadMemos('girls'), loadMemos('midGirls'),
      loadTactics('boys'), loadTactics('girls'), loadTactics('midGirls'),
      loadTacticNames('boys'), loadTacticNames('girls'), loadTacticNames('midGirls'),
      loadTacticCategories('boys'), loadTacticCategories('girls'), loadTacticCategories('midGirls')
    ]);

    // 여중부(midGirls) 11/7 새 대진표 반영 (이전 임시 5경기 캐시 마이그레이션)
    if(localStorage.getItem('kb_midgirls_draw_version') !== '20261107_v1'){
      state.scores.midGirls = {};
      state.times.midGirls = {};
      state.teamNames.midGirls = {};
      state.memos.midGirls = {};
      state.tactics.midGirls = {};
      localStorage.setItem('kb_midgirls_draw_version', '20261107_v1');
      saveScores('midGirls');
      saveTimes('midGirls');
      saveTeamNames('midGirls');
      saveMemos('midGirls');
      saveTactics('midGirls');
    }
    render();

    // 2. Connect to Firebase Firestore for real-time cloud sync
    initFirebaseRealtime();

    // 3. Fallback periodic check for offline mode
    setInterval(async () => {
      if(isFirestoreOnline) return; // Firebase realtime listener handles updates when online
      const ae = document.activeElement;
      if(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
      await loadScores(state.div);
      await loadTimes(state.div);
      await loadTeamColors(state.div);
      await loadTeamNames(state.div);
      await loadRoster(state.div);
      await loadPlayerStats(state.div);
      await loadMemos(state.div);
      await loadTactics(state.div);
      await loadTacticNames(state.div);
      await loadTacticCategories(state.div);
      render();
    }, 7000);
  }
  boot();
})();
</script>
